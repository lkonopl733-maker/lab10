<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="#">MySite</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#slider">Головна</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#services">Послуги</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact">Контакти</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ================= CAROUSEL ================= -->
    <section id="slider" class="pt-5 mt-4">
      <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="image1.jpg" class="d-block w-100" />
          </div>
          <div class="carousel-item">
            <img src="image4.jpg" class="d-block w-100" />
          </div>
          <div class="carousel-item">
            <img src="image3.jpg" class="d-block w-100" />
          </div>
        </div>

        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
        </button>

        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </section>

    <!-- ================= SERVICES ================= -->
    <section id="services" class="container py-5">
      <h2 class="text-center mb-4">Наші послуги</h2>

      <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">Веб-розробка</h5>
              <p class="card-text">Створення сучасних сайтів.</p>
              <a href="#" class="btn btn-primary">Замовити</a>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">SEO</h5>
              <p class="card-text">Просування в Google.</p>
              <a href="#" class="btn btn-primary">Замовити</a>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">Дизайн</h5>
              <p class="card-text">UX/UI дизайн інтерфейсів.</p>
              <a href="#" class="btn btn-primary">Замовити</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= CONTACT FORM ================= -->
    <section id="contact" class="bg-light py-5">
      <div class="container">
        <h2 class="text-center mb-4">Зв'яжіться з нами</h2>

        <div class="row justify-content-center">
          <div class="col-12 col-md-8">
            <form>
              <div class="mb-3">
                <label class="form-label">Ваше ім'я</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Іван Іванов"
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  placeholder="name@example.com"
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Повідомлення</label>
                <textarea class="form-control" rows="3"></textarea>
              </div>

              <button type="submit" class="btn btn-success w-100">
                Відправити
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
